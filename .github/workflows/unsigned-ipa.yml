name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    paths: &build_paths
      - ".github/workflows/unsigned-ipa.yml"
      - "Frameworks/LibXray.xcframework.sha256"
      - "Geodata/**"
      - "Hop/**"
      - "HopTests/**"
      - "Hop.xcodeproj/**"
      - "HopTunnel/**"
      - "LICENSE"
      - "Shared/**"
      - "XrayBridge/**"
      - "project.yml"
      - "scripts/**"
  pull_request:
    paths: *build_paths

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # A failed publish job can be rerun without rebuilding its IPA. Keep the
  # product version stable across attempts so release metadata always matches
  # the artifact, while each new workflow run still advances both bundles.
  BUNDLE_VERSION: ${{ github.run_number }}
  # scripts/build-libxray.sh verifies this exact toolchain before running any
  # upstream code. Go's built-in toolchain manager supplies it from the
  # bootstrap Go installation on the runner.
  GOTOOLCHAIN: go1.27.4

jobs:
  unsigned-ipa:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      ipa_id: ${{ steps.upload_ipa.outputs.artifact-id }}
      checksum_id: ${{ steps.upload_checksum.outputs.artifact-id }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

    steps:
      # Third-party actions are pinned to commit SHAs (tag in the comment):
      # mutable tags can be repointed. The build job has read-only contents
      # permissions and checkout does not persist credentials into .git.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Show Xcode and SDK versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install build tools
        run: |
          set -euo pipefail

          if ! command -v go >/dev/null 2>&1; then
            brew install go
          fi

          go_version="$(go env GOVERSION 2>/dev/null || true)"
          go_minor="$(printf '%s' "$go_version" | sed -E 's/^go1\.([0-9]+).*/\1/')"
          if [[ -z "$go_minor" || "$go_minor" -lt 23 ]]; then
            brew install go
          fi

          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          go version
          xcodegen --version

      - name: Cache Go build artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-libxray-${{ hashFiles('scripts/build-libxray.sh', 'XrayBridge/go.mod', 'XrayBridge/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-libxray-

      - name: Rebuild and verify pinned Xray engine
        run: scripts/build-libxray.sh

      - name: Verify generated inputs and Go bridge
        run: |
          set -euo pipefail
          scripts/verify-geodata.sh
          scripts/generate-xray-client-schema.sh --check
          (cd XrayBridge && go test ./... && go vet ./...)

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          set -euo pipefail

          sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          runtime="com.apple.CoreSimulator.SimRuntime.iOS-${sdk_version//./-}"
          if ! xcrun simctl list runtimes -j | jq -e --arg runtime "$runtime" \
            'any(.runtimes[]; .identifier == $runtime and .isAvailable)' > /dev/null; then
            xcodebuild -downloadPlatform iOS -buildVersion "$sdk_version"
          fi

          device="$(xcrun simctl create 'Hop CI' com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "$runtime")"
          xcodebuild test \
            -project Hop.xcodeproj \
            -scheme Hop \
            -destination "platform=iOS Simulator,id=$device" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned app
        run: |
          set -euo pipefail

          rm -rf build/UnsignedIPA
          mkdir -p build/UnsignedIPA

          xcodebuild \
            -project Hop.xcodeproj \
            -scheme Hop \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/UnsignedIPA/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEPLOYMENT_POSTPROCESSING=YES \
            CURRENT_PROJECT_VERSION="$BUNDLE_VERSION" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail

          APP="build/UnsignedIPA/DerivedData/Build/Products/Release-iphoneos/Hop.app"
          STAGE="build/UnsignedIPA/staging"

          test -d "$APP"
          rm -rf "$STAGE" build/UnsignedIPA/Hop-unsigned.ipa
          mkdir -p "$STAGE/Payload"
          ditto "$APP" "$STAGE/Payload/Hop.app"

          packaged_app="$STAGE/Payload/Hop.app"
          packaged_extension="$packaged_app/PlugIns/HopTunnel.appex"
          test -d "$packaged_extension"
          app_build_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$packaged_app/Info.plist")"
          extension_build_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$packaged_extension/Info.plist")"
          if [[ "$app_build_version" != "$BUNDLE_VERSION" || "$extension_build_version" != "$BUNDLE_VERSION" ]]; then
            echo "::error title=Unexpected CFBundleVersion::Expected ${BUNDLE_VERSION}; Hop.app=${app_build_version}; HopTunnel.appex=${extension_build_version}"
            exit 1
          fi
          echo "Verified CFBundleVersion ${BUNDLE_VERSION} on Hop.app and HopTunnel.appex"

          find "$STAGE/Payload/Hop.app" \( -name _CodeSignature -o -name embedded.mobileprovision \) -print -exec rm -rf {} +
          xattr -cr "$STAGE/Payload/Hop.app" || true

          # Fakesign: ad-hoc signatures whose entitlements mirror the real
          # ones, so sideload signers can read each binary's required
          # capabilities and re-map them onto their own certificate. A
          # CODE_SIGNING_ALLOWED=NO build carries no entitlements blob at all,
          # which makes signers re-sign HopTunnel.appex without the Packet
          # Tunnel entitlement or App Groups — iOS then refuses to launch the
          # extension and the VPN drops from connecting to disconnected
          # immediately. The placeholder XXXXXXXXXX. team prefix is replaced
          # by the signer's real team identifier.
          sed 's/\$(AppIdentifierPrefix)/XXXXXXXXXX./' HopTunnel/HopTunnel.entitlements > "$STAGE/HopTunnel.entitlements"
          sed 's/\$(AppIdentifierPrefix)/XXXXXXXXXX./' Hop/Hop.entitlements > "$STAGE/Hop.entitlements"
          codesign --force --sign - --entitlements "$STAGE/HopTunnel.entitlements" "$STAGE/Payload/Hop.app/PlugIns/HopTunnel.appex"
          codesign --force --sign - --entitlements "$STAGE/Hop.entitlements" "$STAGE/Payload/Hop.app"

          echo "--- Hop.app entitlements ---"
          codesign -d --entitlements - "$STAGE/Payload/Hop.app"
          echo "--- HopTunnel.appex entitlements ---"
          codesign -d --entitlements - "$STAGE/Payload/Hop.app/PlugIns/HopTunnel.appex"

          (cd "$STAGE" && ditto -c -k --sequesterRsrc --keepParent Payload ../Hop-unsigned.ipa)
          unzip -p build/UnsignedIPA/Hop-unsigned.ipa Payload/Hop.app/Acknowledgments.txt \
            | cmp - XrayBridge/Acknowledgments.txt

      - name: Summarize artifact
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          IPA="build/UnsignedIPA/Hop-unsigned.ipa"
          test -f "$IPA"

          size_bytes="$(stat -f '%z' "$IPA")"
          sha256="$(shasum -a 256 "$IPA" | awk '{print $1}')"
          printf '%s  %s\n' "$sha256" "Hop-unsigned.ipa" > build/UnsignedIPA/Hop-unsigned.ipa.sha256
          release_tag="unsigned-ipa-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

          {
            echo "### Unsigned IPA"
            echo
            echo "- File: \`Hop-unsigned.ipa\`"
            echo "- Size: \`${size_bytes} bytes\`"
            echo "- SHA-256: \`${sha256}\`"
            echo "- Product build (CFBundleVersion): \`${BUNDLE_VERSION}\`"
            echo "- Release tag: \`${release_tag}\`"
            echo
            echo "> This IPA is ad-hoc fakesigned (entitlements embedded for re-signers). It still needs proper signing/provisioning before installation on a physical device; the signer must keep the Packet Tunnel entitlement on HopTunnel.appex."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA artifact
        if: github.event_name != 'pull_request'
        id: upload_ipa
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Hop-unsigned.ipa
          path: build/UnsignedIPA/Hop-unsigned.ipa
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload checksum artifact
        if: github.event_name != 'pull_request'
        id: upload_checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Hop-unsigned.ipa.sha256
          path: build/UnsignedIPA/Hop-unsigned.ipa.sha256
          archive: false
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish unsigned IPA release
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: unsigned-ipa
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_ID: ${{ needs.unsigned-ipa.outputs.ipa_id }}
          CHECKSUM_ID: ${{ needs.unsigned-ipa.outputs.checksum_id }}
        run: |
          set -euo pipefail
          mkdir -p build/UnsignedIPA

          download_artifact() {
            local artifact_id="$1" output="$2"
            if [[ ! "$artifact_id" =~ ^[0-9]+$ ]]; then
              echo "::error::Missing or invalid build artifact ID for $output"
              exit 1
            fi

            curl --fail --location --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              --output "$output"
            test -s "$output"
          }

          download_artifact "$IPA_ID" "build/UnsignedIPA/Hop-unsigned.ipa"
          download_artifact "$CHECKSUM_ID" "build/UnsignedIPA/Hop-unsigned.ipa.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          IPA="build/UnsignedIPA/Hop-unsigned.ipa"
          CHECKSUM="build/UnsignedIPA/Hop-unsigned.ipa.sha256"
          test -f "$IPA"
          test -f "$CHECKSUM"

          size_bytes="$(stat -c '%s' "$IPA")"
          (cd build/UnsignedIPA && sha256sum --check --strict Hop-unsigned.ipa.sha256)
          sha256="$(awk '{print $1}' "$CHECKSUM")"
          release_tag="unsigned-ipa-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          if [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            release_name="Hop main build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          else
            release_name="Hop preview ($GITHUB_REF_NAME) ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi
          release_notes="build/UnsignedIPA/release-notes.md"

          cat > "$release_notes" <<EOF
          Unsigned IPA built from ${GITHUB_REPOSITORY}@${GITHUB_SHA}.

          - Branch/ref: ${GITHUB_REF_NAME}
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Product build (CFBundleVersion): ${BUNDLE_VERSION}
          - Size: ${size_bytes} bytes
          - SHA-256: ${sha256}

          This IPA is ad-hoc fakesigned: each binary carries its required entitlements (Packet Tunnel, App Groups, Keychain) with a placeholder XXXXXXXXXX. team prefix so sideload signers can re-map them. It still needs proper signing/provisioning before installation on a physical device. When re-signing, make sure your tool signs the embedded HopTunnel.appex with the Packet Tunnel entitlement — without it iOS kills the VPN extension at launch.
          EOF

          gh release create "$release_tag" \
            "$IPA#Hop-unsigned.ipa" \
            "$CHECKSUM#Hop-unsigned.ipa.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$release_name" \
            --notes-file "$release_notes" \
            --prerelease \
            --latest=false

          release_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${release_tag}"
          echo "- Release: ${release_url}" >> "$GITHUB_STEP_SUMMARY"
